# ==========================================
# LAYER 1 & 2: SCHEMA VERSION & GLOBAL CONTEXT
# ==========================================
version: 2

# ==========================================
# LAYER 3: TARGET DECLARATIONS (ECOSYSTEMS)
# ==========================================
updates:
  # Python Package Monitoring
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
      
    # ==========================================
    # LAYER 4: GRANULAR CONSTRAINTS & IGNORES
    # ==========================================
    ignore:
      - dependency-name: "requests"
        update-types: ["version-update:semver-major"]

  # GitHub Actions Workflow Monitoring
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
